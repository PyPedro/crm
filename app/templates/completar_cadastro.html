<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar cadastro - Optmiza CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .rise { animation: rise .45s ease-out both; }
    </style>
</head>
<body class="min-h-screen bg-[#101b22] text-white flex items-center justify-center p-5">
    <main class="rise w-full max-w-lg rounded-2xl border border-white/10 bg-[#17252d] p-7 shadow-2xl sm:p-10">
        <div class="mb-8 flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#d3f36b] font-extrabold text-[#16382e]">O</span>
            <span class="text-sm font-bold tracking-wide">OPTMIZA <span class="font-normal text-white/65">CRM</span></span>
        </div>
        <p class="mb-2 text-xs font-bold uppercase text-[#d3f36b]">Quase concluído</p>
        <h1 class="text-2xl font-bold">Complete o seu cadastro</h1>
        <p class="mt-2 text-sm leading-6 text-slate-400">Informe seu nome e o nome da empresa. A conta ficará pendente até aprovação da nossa equipa.</p>

        {% if erro %}
        <div role="alert" class="mt-6 rounded-lg border border-rose-400/30 bg-rose-400/10 px-4 py-3 text-sm text-rose-200">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('main.completar_cadastro') }}" class="mt-7 space-y-5">
            <div>
                <label for="email" class="mb-2 block text-xs font-semibold text-slate-300">Email Google</label>
                <input id="email" type="email" value="{{ email }}" readonly class="w-full rounded-lg border border-white/10 bg-[#101b22] px-4 py-3 text-sm text-slate-400 outline-none">
            </div>
            <div>
                <label for="nome_utilizador" class="mb-2 block text-xs font-semibold text-slate-300">Nome do utilizador</label>
                <input id="nome_utilizador" name="nome_utilizador" type="text" required maxlength="50" autocomplete="name" value="{{ nome_utilizador|default('') }}" placeholder="Como devemos chamar você?" class="w-full rounded-lg border border-white/10 bg-[#101b22] px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-[#d3f36b] focus:ring-2 focus:ring-[#d3f36b]/20">
            </div>
            <div>
                <label for="nome_empresa" class="mb-2 block text-xs font-semibold text-slate-300">Nome da empresa</label>
                <input id="nome_empresa" name="nome_empresa" type="text" required maxlength="120" autocomplete="organization" value="{{ nome_empresa|default('') }}" placeholder="Ex.: Acme Comercial" class="w-full rounded-lg border border-white/10 bg-[#101b22] px-4 py-3 text-sm text-white outline-none transition placeholder:text-slate-500 focus:border-[#d3f36b] focus:ring-2 focus:ring-[#d3f36b]/20">
            </div>
            <button type="submit" class="w-full rounded-lg bg-[#d3f36b] px-4 py-3.5 text-sm font-bold text-[#16382e] transition hover:bg-[#e1ff91] focus:outline-none focus:ring-2 focus:ring-[#d3f36b] focus:ring-offset-2 focus:ring-offset-[#17252d]">Enviar para aprovação</button>
        </form>
    </main>
</body>
</html>
